name: Build SIPRIN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
            mkdir -p "$SDK_DIR"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          # Pre-accept standard Android SDK licenses so Gradle & sdkmanager never block
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android & CLI
        run: |
          npm install @capacitor/android@^8 --no-save
          npm install --save-dev @capacitor/cli@^8 --no-save

      - name: Build React application
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Android & App Icons
        run: |
          npx cap sync android
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              [ -f "$dir/ic_launcher.png" ] && cp public/pwa-192x192.png "$dir/ic_launcher.png" || true
              [ -f "$dir/ic_launcher_round.png" ] && cp public/pwa-192x192.png "$dir/ic_launcher_round.png" || true
              [ -f "$dir/ic_launcher_foreground.png" ] && cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload SIPRIN APK
        uses: actions/upload-artifact@v4
        with:
          name: SIPRIN-POLRI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
