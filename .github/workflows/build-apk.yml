name: Build SIPRIN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install

      # 6. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8

      # 7. Build web application
      - name: Build web application
        run: npm run build

      # 8. Create Android platform
      - name: Create Android platform
        run: npx cap add android

      # 9. Sync Android platform
      - name: Sync Android platform
        run: npx cap sync android

      # 10. Build debug APK
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIPRIN-POLRI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
 

